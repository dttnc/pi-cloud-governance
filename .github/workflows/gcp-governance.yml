name: "GCP Cloud Governance GitOps"

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - "terraform/gcp/**"
      - "terraform/definitions/gcp.tfvars"
      - "terraform/_modules/data_project_factory/**"
      - "terraform/_modules/workload_identity/**"
      - ".github/workflows/gcp-governance.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  terraform-plan:
    name: "GCP Projects & IAM Plan"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.0"
          terraform_wrapper: false

      - name: Authenticate to GCP via WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_SA }}

      - name: Terraform Plan
        id: plan
        run: |
          echo "### ☁️ GCP Governance Plan (\`terraform/gcp/projects\`)" > plan.md
          echo "<details><summary>Click to view plan</summary>" >> plan.md
          echo "" >> plan.md
          echo "\`\`\`hcl" >> plan.md

          terraform -chdir=terraform/gcp/projects init
          terraform -chdir=terraform/gcp/projects plan -var-file=../../definitions/gcp.tfvars -no-color 2>&1 | tee -a plan.md

          echo "\`\`\`" >> plan.md
          echo "</details>" >> plan.md

      - name: Post Plan to PR
        uses: mshick/add-pr-comment@v2
        with:
          message-id: tf-plan-gcp
          message-path: plan.md

  terraform-apply:
    name: "Apply GCP Governance"
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.0"
          terraform_wrapper: false

      - name: Authenticate to GCP via WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_SA }}

      - name: Terraform Apply
        run: |
          terraform -chdir=terraform/gcp/projects init
          terraform -chdir=terraform/gcp/projects apply -var-file=../../definitions/gcp.tfvars -auto-approve
