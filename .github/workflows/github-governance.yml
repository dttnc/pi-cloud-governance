name: "GitHub Org Governance GitOps"

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - "terraform/github/**"
      - "terraform/_modules/github_governance/**"
      - "terraform/definitions/github.tfvars"
      - ".github/workflows/github-governance.yml"

  push:
    branches: [ "main" ]
    paths:
      - "terraform/github/**"
      - "terraform/_modules/github_governance/**"
      - "terraform/definitions/github.tfvars"
      - ".github/workflows/github-governance.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  terraform-plan:
    name: "GitHub Governance Plan"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to GCP (State Access)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_SA }}

      - name: Generate App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.0"

      - name: Terraform Init
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: terraform -chdir=terraform/github init

      - name: Terraform Plan
        id: plan
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          echo "### 🤖 GitHub Governance Plan (\`terraform/github\`)" > plan.md
          echo "<details><summary>Click to view plan</summary>" >> plan.md
          echo "" >> plan.md
          echo "\`\`\`hcl" >> plan.md
          terraform -chdir=terraform/github plan -var-file=../definitions/github.tfvars -no-color 2>&1 | tee -a plan.md
          echo "\`\`\`" >> plan.md
          echo "</details>" >> plan.md

      - name: Post Plan to PR
        uses: mshick/add-pr-comment@v2
        with:
          message-id: tf-plan-github
          message-path: plan.md

  terraform-apply:
    name: "Apply GitHub Org Governance"
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to GCP (State Access)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_SA }}

      - name: Generate App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.0"

      - name: Terraform Init & Apply
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          terraform -chdir=terraform/github init
          terraform -chdir=terraform/github apply -var-file=../definitions/github.tfvars -auto-approve
